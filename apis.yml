aid: adasky
name: Adasky
description: >-
  ADASKY (Adasky Ltd.) is an Israeli automotive sensor company founded in January 2016 and
  headquartered in Yokneam, Israel, that develops and manufactures automotive-grade long-wave
  infrared (LWIR) thermal imaging cameras and the perception software that runs on them. Its
  flagship product, Viper, is a compact solid-state shutterless thermal camera with 50mK
  sensitivity, object detection to about 300 metres and living-being classification beyond 200
  metres, sold into ADAS and autonomous-vehicle programs for pedestrian, cyclist and wildlife
  detection, free-space detection and automatic emergency braking in darkness, glare and fog. A
  second line, SharpVision, serves intelligent transportation, V2X and smart-city infrastructure.
  ADASKY publishes no developer program, API reference, SDK or machine-readable specification;
  its software ships embedded in the camera under commercial OEM engagement.
